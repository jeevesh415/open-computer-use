<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{subject}}</title>
<style>
  body { margin: 0; padding: 0; background-color: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .wrapper { width: 100%; background-color: #f4f4f7; padding: 40px 0; }
  .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .header { background-color: #0a0a0a; padding: 24px 32px; text-align: center; }
  .header img { height: 32px; }
  .header h1 { color: #ffffff; font-size: 20px; margin: 8px 0 0; font-weight: 600; }
  .content { padding: 32px; color: #333333; font-size: 15px; line-height: 1.7; }
  .content h2 { color: #111; font-size: 20px; margin-top: 0; }
  .content p { margin: 0 0 16px; }
  .content ul { margin: 0 0 16px; padding-left: 20px; }
  .content li { margin-bottom: 8px; }
  .content a { color: #2563eb; text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .cta { text-align: center; margin: 24px 0; }
  .cta a { display: inline-block; background-color: #2563eb; color: #ffffff !important; padding: 12px 32px; border-radius: 6px; font-weight: 600; text-decoration: none; font-size: 15px; }
  .footer { padding: 24px 32px; text-align: center; font-size: 12px; color: #9ca3af; border-top: 1px solid #e5e7eb; }
  .footer a { color: #9ca3af; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <div class="header">
      <h1>Coasty</h1>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      <p>&copy; 2026 Coasty. All rights reserved.</p>
      <p><a href="{{unsubscribe_url}}">Unsubscribe</a></p>
    </div>
  </div>
</div>
</body>
</html>
