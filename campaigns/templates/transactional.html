<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; padding: 0; background-color: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .wrapper { width: 100%; background-color: #f4f4f7; padding: 40px 0; }
  .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; }
  .content { padding: 32px; color: #333333; font-size: 15px; line-height: 1.7; }
  .content p { margin: 0 0 16px; }
  .content a { color: #2563eb; }
  .footer { padding: 16px 32px; text-align: center; font-size: 11px; color: #9ca3af; }
  .footer a { color: #9ca3af; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="container">
    <div class="content">
      {{content}}
    </div>
    <div class="footer">
      <p>Coasty &middot; <a href="{{unsubscribe_url}}">Unsubscribe</a></p>
    </div>
  </div>
</div>
</body>
</html>
