appId: com.coasty.desktop
productName: Coasty Desktop
protocols:
  - name: Coasty Desktop
    schemes:
      - coasty
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!node_modules/**/*"
  - node_modules/puppeteer-core/**/*
  - node_modules/ws/**/*
extraResources:
  - from: build/icon.png
    to: icon.png
publish:
  provider: generic
  url: https://updates.coasty.ai
win:
  target:
    - nsis
  icon: build/icon.ico
  azureSignOptions:
    endpoint: "https://eus.codesigning.azure.net/"
    codeSigningAccountName: "coastyai"
    certificateProfileName: "coasty-desktop"
    publisherName: "Prateek Yashwant Jannu"
mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
